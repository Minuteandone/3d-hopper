name: Validate web port

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check js/rom.js
          node --check js/executable.js
          node --check js/runtime.js
          node --check js/cgfx.js
          node --check js/models.js
          node --check js/lights.js
          node --check js/luts.js
          node --check js/fragment-lighting.js
          node --check js/texenv.js
          node --check js/pica-material.js
          node --check js/model-renderer.js
          node --check js/animation.js
          node --check js/emitters.js
          node --check js/effects.js
          node --check js/audio.js
          node --check js/bcsar.js
          node --check js/game.js
          node --check js/main.js
          node --check tests/rom-test.mjs
          node --check tests/animation-test.mjs
          node --check tests/emitters-test.mjs
          node --check tests/effects-test.mjs
          node --check tests/fragment-lighting-test.mjs
          node --check tests/texenv-test.mjs

          node --check tests/code-lift-test.mjs
          node --check tests/runtime-test.mjs
          node --check tests/bcsar-test.mjs
      - name: Run ROM-free unit tests
        run: |
          node tests/fragment-lighting-test.mjs
          node tests/texenv-test.mjs
